name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version and tag
        id: version
        shell: pwsh
        env:
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $parameters = @{}
          if ($env:BUILD_EVENT -eq "pull_request") {
            $parameters = @{ PullRequestNumber = $env:PR_NUMBER; HeadSha = $env:PR_SHA }
          }
          $buildVersion = & .\.github\scripts\Get-BuildVersion.ps1 @parameters
          $version = $buildVersion.Version
          $fullVersion = $buildVersion.FullVersion
          if ($env:BUILD_EVENT -eq "push" -and $env:BUILD_REF -eq "refs/heads/master") {
            $existingTag = git tag --list "v$version"
            if ($LASTEXITCODE -ne 0) { throw "Failed to read version tag" }
            if ($existingTag) {
              $tagCommit = git rev-parse "refs/tags/v$version^{commit}"
              if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
                throw "Tag v$version does not point to this commit"
              }
            } else {
              git tag "v$version"
              if ($LASTEXITCODE -ne 0) { throw "Failed to create tag v$version" }
            }
            git push origin "v$version"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push tag v$version" }
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "fullVersion=$fullVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $version, full: $fullVersion"

      - name: Patch assembly version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $fullVersion = "${{ steps.version.outputs.fullVersion }}"
          $file = "Rapr/Properties/AssemblyInfo.cs"
          $content = Get-Content $file -Raw
          $content = $content -replace 'AssemblyVersion\(".*?"\)', "AssemblyVersion(`"$version`")"
          $content = $content -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(`"$version`")"
          $content = $content -replace 'AssemblyInformationalVersion\(".*?"\)', "AssemblyInformationalVersion(`"$fullVersion`")"
          Set-Content $file $content

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore Rapr.sln

      - name: Build
        run: msbuild Rapr.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test RaprTests\RaprTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$results = Get-Content TestResults\tests.trx
          if ([int]$results.TestRun.ResultSummary.Counters.executed -eq 0) {
            throw "No tests were executed."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DriverStoreExplorer-v${{ steps.version.outputs.fullVersion }}-unsigned
          path: Rapr/bin/Release/
