name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version and tag
        id: version
        shell: pwsh
        env:
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tags = @(git tag --list)
          if ($LASTEXITCODE -ne 0) { throw "Failed to list version tags" }
          $latest = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]($_.Substring(1)) } -Descending | Select-Object -First 1
          if (-not $latest) { throw "No valid version tag found" }
          $latestVersion = [version]($latest.Substring(1))
          $version = "$($latestVersion.Major).$($latestVersion.Minor).$($latestVersion.Build + 1)"
          $buildId = "$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          if ($env:BUILD_EVENT -eq "pull_request") {
            $sha = $env:PR_SHA.Substring(0, 8)
            $fullVersion = "$version-pr.$env:PR_NUMBER.$buildId+$sha"
          } else {
            $headTags = @(git tag --points-at HEAD)
            if ($LASTEXITCODE -ne 0) { throw "Failed to read tags on HEAD" }
            $existingTag = $headTags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Sort-Object { [version]($_.Substring(1)) } -Descending | Select-Object -First 1
            if ($existingTag) {
              $version = $existingTag.Substring(1)
            } elseif ($env:BUILD_EVENT -eq "push" -and $env:BUILD_REF -eq "refs/heads/master") {
              Write-Host "Tag commit: v$version"
              git tag "v$version"
              if ($LASTEXITCODE -ne 0) { throw "Failed to create tag v$version" }
              git push origin "v$version"
              if ($LASTEXITCODE -ne 0) { throw "Failed to push tag v$version" }
            }
            $fullVersion = $version
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "fullVersion=$fullVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $version, full: $fullVersion"

      - name: Patch assembly version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $fullVersion = "${{ steps.version.outputs.fullVersion }}"
          $file = "Rapr/Properties/AssemblyInfo.cs"
          $content = Get-Content $file -Raw
          $content = $content -replace 'AssemblyVersion\(".*?"\)', "AssemblyVersion(`"$version`")"
          $content = $content -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(`"$version`")"
          $content = $content -replace 'AssemblyInformationalVersion\(".*?"\)', "AssemblyInformationalVersion(`"$fullVersion`")"
          Set-Content $file $content

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Rapr.sln

      - name: Build
        run: msbuild Rapr.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test RaprTests\RaprTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$results = Get-Content TestResults\tests.trx
          if ([int]$results.TestRun.ResultSummary.Counters.executed -eq 0) {
            throw "No tests were executed."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DriverStoreExplorer-v${{ steps.version.outputs.fullVersion }}-unsigned
          path: Rapr/bin/Release/
